<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guitar Chords Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #191919;
      --panel: #292929;
      --panel-2: #343238;
      --panel-3: #202020;
      --text: #f1f1f1;
      --muted: #c8c8c8;
      --quiet: #9f9f9f;
      --border: #464646;
      --root: #00a85a;
      --tone: #2f72d6;
      --warning: #d4a22f;
      --danger: #c95e5e;
      --focus: #ddbd63;
      --button: #5b5762;
      --button-hover: #68636f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1220px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: right;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(116px, 0.8fr) minmax(260px, 1.7fr) minmax(160px, 1fr) minmax(190px, 1.1fr);
      gap: 12px;
      align-items: end;
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-weight: 700;
    }

    select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--text);
      padding: 0 12px;
      font: inherit;
    }

    button {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--button);
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover,
    button:focus {
      background: var(--button-hover);
    }

    button:focus {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    select:focus {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .viewer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .formula {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      max-width: 100%;
      border-radius: 999px;
      background: #183d2c;
      color: #c9f5dd;
      padding: 0 12px;
      font-size: 0.9rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .fretboard-wrap {
      overflow-x: auto;
      background: var(--panel-3);
      border: 1px solid #303030;
      border-radius: 6px;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 760px;
      height: auto;
      aspect-ratio: 7 / 3;
    }

    .messages {
      display: grid;
      gap: 5px;
      margin-top: 12px;
      color: var(--muted);
      font-weight: 650;
    }

    .messages p {
      margin: 0;
    }

    .playability[data-rating="playable"] {
      color: #bff2d8;
    }

    .playability[data-rating="stretchy"] {
      color: #f0d392;
    }

    .playability[data-rating="not recommended"] {
      color: #efb2b2;
    }

    @media (max-width: 920px) {
      main {
        width: min(100vw - 18px, 1220px);
        padding: 14px 0;
      }

      header,
      .summary {
        display: block;
      }

      .meta {
        margin-top: 8px;
        text-align: left;
      }

      .controls {
        grid-template-columns: 1fr 1fr;
      }

      .formula {
        margin-top: 8px;
      }
    }

    @media (max-width: 620px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .viewer {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Advanced Drop Chord Visualizer</h1>
      <p class="meta">Browser version with Web Audio playback</p>
    </header>

    <section class="controls" aria-label="Chord controls">
      <div>
        <label for="rootNote">Key Root</label>
        <select id="rootNote"></select>
      </div>
      <div>
        <label for="chordFamily">Chord Quality</label>
        <select id="chordFamily"></select>
      </div>
      <div>
        <label for="chordType">Voicing Type</label>
        <select id="chordType"></select>
      </div>
      <div>
        <label for="inversion">Inversion</label>
        <select id="inversion"></select>
      </div>
      <div>
        <label for="playMode">Play Mode</label>
        <select id="playMode">
          <option value="Chord">Chord</option>
          <option value="Arpeggio">Arpeggio</option>
        </select>
      </div>
      <div>
        <label for="playButton">Audio</label>
        <button id="playButton" type="button">Play</button>
      </div>
    </section>

    <section class="viewer" aria-live="polite">
      <div class="summary">
        <h2 id="title"></h2>
        <span class="formula" id="formula"></span>
      </div>
      <div class="fretboard-wrap">
        <svg id="fretboard" role="img" aria-labelledby="title"></svg>
      </div>
      <div class="messages">
        <p id="status"></p>
        <p class="playability" id="playability"></p>
        <p id="audioStatus"></p>
        <p id="voicingNote"></p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
