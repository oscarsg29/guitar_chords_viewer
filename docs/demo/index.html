<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guitar Chords Viewer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f8;
      --panel: #ffffff;
      --panel-2: #f9fafb;
      --panel-3: #ffffff;
      --text: #202124;
      --muted: #555f6d;
      --quiet: #747c87;
      --border: #d4d9df;
      --root: #00a85a;
      --tone: #2f72d6;
      --warning: #d4a22f;
      --danger: #c95e5e;
      --focus: #1f63b7;
      --button: #1f63b7;
      --button-hover: #174f94;
      --success-bg: #e6f6ec;
      --success-text: #226b39;
      --success-border: #8fd1a3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1220px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .meta,
    .app-footer {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .meta {
      margin: 0;
      text-align: right;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(520px, 1.8fr) minmax(240px, 0.8fr) minmax(300px, 1fr);
      gap: 14px;
      align-items: stretch;
      margin-bottom: 14px;
    }

    .control-group {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px 14px 14px;
    }

    .control-group h2 {
      margin: 0 0 14px;
      color: #1f63b7;
      font-size: 1rem;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      align-items: end;
    }

    .playback-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 56px;
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-weight: 650;
    }

    select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--text);
      padding: 0 12px;
      font: inherit;
    }

    button {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--button);
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .play-button {
      display: inline-grid;
      place-items: center;
      padding: 0;
      font-size: 1.25rem;
    }

    button:hover,
    button:focus {
      background: var(--button-hover);
    }

    button:focus {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    select:focus {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .viewer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .formula {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      max-width: 100%;
      border-radius: 999px;
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
      padding: 0 12px;
      font-size: 0.9rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .fretboard-wrap {
      overflow: hidden;
      background: var(--panel-3);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 7 / 3;
    }

    .messages {
      display: grid;
      gap: 5px;
      margin-top: 0;
      color: var(--muted);
      font-weight: 650;
    }

    .messages p {
      margin: 0;
    }

    .playability[data-rating="playable"] {
      display: inline-flex;
      width: fit-content;
      border: 1px solid var(--success-border);
      border-radius: 6px;
      background: var(--success-bg);
      color: var(--success-text);
      padding: 5px 9px;
    }

    .playability[data-rating="stretchy"] {
      color: #7a5700;
    }

    .playability[data-rating="not recommended"] {
      color: #9d3030;
    }

    .app-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 0 2px;
    }

    .instagram-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: #202124;
    }

    @media (max-width: 920px) {
      main {
        width: min(100vw - 18px, 1220px);
        padding: 14px 0;
      }

      header,
      .summary {
        display: block;
      }

      .meta {
        margin-top: 8px;
        text-align: left;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .formula {
        margin-top: 8px;
      }

      .control-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 620px) {
      .control-grid,
      .playback-grid {
        grid-template-columns: 1fr;
      }

      .viewer {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Advanced Drop Chord Visualizer</h1>
      <p class="meta">Browser version with Web Audio playback</p>
    </header>

    <section class="controls" aria-label="Chord controls">
      <div class="control-group">
        <h2>Chord</h2>
        <div class="control-grid">
          <div>
            <label for="rootNote">Key Root</label>
            <select id="rootNote"></select>
          </div>
          <div>
            <label for="chordFamily">Chord Quality</label>
            <select id="chordFamily"></select>
          </div>
          <div>
            <label for="chordType">Drop Type</label>
            <select id="chordType"></select>
          </div>
          <div>
            <label for="inversion">Inversion</label>
            <select id="inversion"></select>
          </div>
        </div>
      </div>
      <div class="control-group">
        <h2>Playback</h2>
        <div class="playback-grid">
          <div>
            <label for="playMode">Play Mode</label>
            <select id="playMode">
              <option value="Chord">Chord</option>
              <option value="Arpeggio">Arpeggio</option>
            </select>
          </div>
          <div>
            <label for="playButton">Audio</label>
            <button class="play-button" id="playButton" type="button" aria-label="Play selected chord">▶</button>
          </div>
        </div>
      </div>
      <div class="control-group">
        <h2>Info</h2>
        <div class="messages" aria-live="polite">
          <p class="playability" id="playability"></p>
          <p id="status"></p>
          <p id="audioStatus"></p>
          <p id="voicingNote"></p>
        </div>
      </div>
    </section>

    <section class="viewer">
      <div class="summary">
        <h2 id="title"></h2>
        <span class="formula" id="formula"></span>
      </div>
      <div class="fretboard-wrap">
        <svg id="fretboard" role="img" aria-labelledby="title"></svg>
      </div>
    </section>
    <footer class="app-footer">
      <span>Version: local build | Author: Oscar Osorio | Instagram</span>
      <svg class="instagram-icon" viewBox="0 0 24 24" aria-label="Instagram" role="img">
        <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"></rect>
        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle>
        <circle cx="17.5" cy="6.5" r="1.3" fill="currentColor"></circle>
      </svg>
      <span>@bones29sg</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
